<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<div class="container">
<h2>Admin Dashboard</h2>
<hr>
<h3>Student Login</h3>
<a href="/student_login">Click here to login as Student</a>

<h3>Admin Controls</h3>

<a href="/add_department">Add Department</a><br><br>
<a href="/add_semester">Add Semester</a><br><br>
<a href="/add_teacher">Add Teacher</a><br><br>
<a href="/add_student">Add Student</a><br><br>


<h3>All Students</h3>

<table>
<tr>
<th>ID</th>
<th>Reg No</th>
<th>Name</th>
<th>Department</th>
</tr>

{% for s in students %}
<tr>
<td>{{s[0]}}</td>
<td>{{s[1]}}</td>
<td>{{s[2]}}</td>
<td>{{s[3]}}</td>
</tr>
{% endfor %}
</table>

<a href="/logout"><button>Logout</button></a>
</div>
