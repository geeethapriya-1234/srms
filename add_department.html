<!DOCTYPE html>

<html>
<head>
    <title>Add Department</title>

```
<style>
    body{
        font-family: Arial;
        background:#f2f2f2;
        text-align:center;
        margin-top:80px;
    }

    .box{
        width:350px;
        margin:auto;
        padding:25px;
        background:white;
        border-radius:10px;
        box-shadow:0px 0px 10px gray;
    }

    input{
        width:90%;
        padding:10px;
        margin-top:10px;
        border-radius:6px;
        border:1px solid #ccc;
    }

    button{
        margin-top:15px;
        padding:10px 20px;
        background:#4CAF50;
        color:white;
        border:none;
        border-radius:6px;
        cursor:pointer;
    }

    button:hover{
        background:#45a049;
    }

    a{
        text-decoration:none;
        color:blue;
    }
</style>
```

</head>
<body>

<div class="box">
    <h2>Add Department</h2>

```
<form method="POST">
    <label>Department Name</label><br>
    <input type="text" name="dept" placeholder="Enter Department" required>

    <br>
    <button type="submit">Add</button>
</form>

<br>
<a href="/admin">⬅ Back to  Dashboard</a>
```

</div>

</body>
</html>
